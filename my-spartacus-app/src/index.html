<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MySpartacusApp</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="occ-backend-base-url" content="https://localhost:9002" />
    <script>
        // Extract the code from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
      console.log(code,window.location.origin,urlParams)
        // Check if we have a code and if this window was opened by our main app
        if (code && window.opener) {
            // Post the code back to the main window
            window.opener.postMessage({ type: 'OAUTH_CODE',   code: urlParams.get('code'),
  state: urlParams.get('state')}, window.location.origin);
    
            // Close this popup
            window.close();
        }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
